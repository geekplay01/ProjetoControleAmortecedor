<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}PERFECT Shock Data{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
<script>try{var t=localStorage.getItem("psd-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="{% block bodyclass %}{% endblock %}">{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
